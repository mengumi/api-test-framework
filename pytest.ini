[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
# 把项目根目录加入 sys.path，保证 `import common.*` 在两种启动方式下都成立。
# `python -m pytest` 会把当前目录塞进 sys.path，而 `pytest` 控制台脚本不会，
# 于是 CI 上出现 ModuleNotFoundError: No module named 'common'。
pythonpath = .
addopts = -v --tb=short --strict-markers --color=yes
markers =
    smoke: 冒烟用例，核心链路必须通过
    regression: 缺陷回归用例，对应 docs/BUGS.md 中的缺陷编号
    contract: 响应契约校验用例
    boundary: 边界值与等价类用例
